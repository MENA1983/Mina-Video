name: Mina Video GPU Gate Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "video-runner/gpu_compute_router.py"
      - "tests/test_gpu_compute_router.py"
      - "video-runner/gpu_job_contract.py"
      - "tests/test_gpu_job_contract.py"
      - "architecture/ON_DEMAND_FREE_GPU.md"
      - ".github/workflows/gpu-gate-tests.yml"
  push:
    branches: [main]
    paths:
      - "video-runner/gpu_compute_router.py"
      - "tests/test_gpu_compute_router.py"
      - "video-runner/gpu_job_contract.py"
      - "tests/test_gpu_job_contract.py"
      - "architecture/ON_DEMAND_FREE_GPU.md"
      - ".github/workflows/gpu-gate-tests.yml"

permissions:
  contents: read

jobs:
  gpu-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_gpu_compute_router.py tests/test_gpu_job_contract.py
