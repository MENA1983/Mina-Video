name: Mina Video Renderer

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: HTTPS URL to an external-video/v1 JSON manifest
        required: false
        type: string
      manifest_sha256:
        description: Expected SHA-256 of manifest bytes when using manifest_url
        required: false
        type: string
  repository_dispatch:
    types: [render-video]

permissions:
  contents: write

concurrency:
  group: mina-video-${{ github.event.client_payload.manifest_sha256 || inputs.manifest_sha256 || github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Receive manifest from factory dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          MANIFEST_JSON: ${{ toJSON(github.event.client_payload.manifest) }}
          EXPECTED_SHA256: ${{ github.event.client_payload.manifest_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          raw=json.dumps(json.loads(os.environ['MANIFEST_JSON']),separators=(',',':'),ensure_ascii=False,sort_keys=True).encode()
          actual=hashlib.sha256(raw).hexdigest()
          expected=os.environ['EXPECTED_SHA256'].strip().lower()
          if actual != expected: raise SystemExit(f'manifest sha256 mismatch: {actual}')
          if len(raw)>5*1024*1024: raise SystemExit('manifest too large')
          open('manifest.json','wb').write(raw)
          PY

      - name: Receive manifest from HTTPS URL
        if: github.event_name == 'workflow_dispatch' && inputs.manifest_url != ''
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          EXPECTED_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, os, urllib.parse, urllib.request
          u=urllib.parse.urlparse(os.environ['MANIFEST_URL'])
          if u.scheme!='https' or not u.netloc or u.fragment: raise SystemExit('manifest_url must be HTTPS without fragment')
          req=urllib.request.Request(os.environ['MANIFEST_URL'],headers={'User-Agent':'mina-video-runner/1'})
          with urllib.request.urlopen(req,timeout=30) as r: data=r.read(5*1024*1024+1)
          if len(data)>5*1024*1024: raise SystemExit('manifest too large')
          actual=hashlib.sha256(data).hexdigest()
          if actual != os.environ['EXPECTED_SHA256'].strip().lower(): raise SystemExit(f'sha256 mismatch: {actual}')
          open('manifest.json','wb').write(data)
          PY

      - name: Validate manifest and derive idempotency tag
        run: |
          python - <<'PY'
          import hashlib,json,re
          m=json.load(open('manifest.json',encoding='utf-8'))
          if m.get('schema')!='external-video/v1': raise SystemExit('unsupported manifest schema')
          job=str(m.get('job_id','')).strip()
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,80}',job): raise SystemExit('job_id is not safe for a release tag')
          raw=open('manifest.json','rb').read()
          digest=hashlib.sha256(raw).hexdigest()
          open('render-tag.env','w').write(f'RENDER_TAG=mina-video-{job}\nMANIFEST_SHA256={digest}\n')
          PY
          test -s manifest.json

      - name: Check existing render before spending render time
        id: duplicate_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./render-tag.env
          if gh release view "$RENDER_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Existing render found; refusing duplicate render."
            gh release view "$RENDER_TAG" --json url --jq .url
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render MP4
        if: steps.duplicate_guard.outputs.exists != 'true'
        env:
          # Repository variable, intentionally not a secret. Empty means fail-closed.
          MINA_VIDEO_ALLOWED_HOSTS: ${{ vars.MINA_VIDEO_ALLOWED_HOSTS }}
        run: python video-runner/render.py --manifest manifest.json --output output.mp4 | tee render-result.json

      - name: Publish deterministic render artifact
        if: steps.duplicate_guard.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./render-tag.env
          if gh release view "$RENDER_TAG" >/dev/null 2>&1; then
            echo "Another worker published this job first; no duplicate publication."
            gh release view "$RENDER_TAG" --json url --jq .url
            exit 0
          fi
          gh release create "$RENDER_TAG" output.mp4 --title "Mina Video $RENDER_TAG" --notes-file render-result.json
          gh release view "$RENDER_TAG" --json url --jq .url
