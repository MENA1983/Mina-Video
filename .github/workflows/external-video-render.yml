name: Mina Video Renderer

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: HTTPS URL to an external-video/v1 JSON manifest
        required: false
        type: string
      manifest_sha256:
        description: Expected SHA-256 of manifest bytes when using manifest_url
        required: false
        type: string
  repository_dispatch:
    types: [render-video]

permissions:
  contents: write

concurrency:
  group: mina-video-${{ github.event.client_payload.manifest_sha256 || inputs.manifest_sha256 || github.run_id }}
  cancel-in-progress: false

env:
  MINA_VIDEO_ALLOWED_HOSTS: ${{ vars.MINA_VIDEO_ALLOWED_HOSTS }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Receive manifest from factory dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          MANIFEST_JSON: ${{ toJSON(github.event.client_payload.manifest) }}
          EXPECTED_SHA256: ${{ github.event.client_payload.manifest_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          raw=json.dumps(json.loads(os.environ['MANIFEST_JSON']),separators=(',',':'),ensure_ascii=False,sort_keys=True).encode()
          actual=hashlib.sha256(raw).hexdigest()
          expected=os.environ['EXPECTED_SHA256'].strip().lower()
          if not expected or actual != expected: raise SystemExit(f'manifest sha256 mismatch: {actual}')
          if len(raw)>5*1024*1024: raise SystemExit('manifest too large')
          open('manifest.json','wb').write(raw)
          PY

      - name: Receive manifest from HTTPS URL
        if: github.event_name == 'workflow_dispatch' && inputs.manifest_url != ''
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          EXPECTED_SHA256: ${{ inputs.manifest_sha256 }}
          ALLOWED_HOSTS: ${{ vars.MINA_VIDEO_ALLOWED_HOSTS }}
        run: |
          python - <<'PY'
          import hashlib, ipaddress, os, socket, urllib.parse, urllib.request
          raw_url=os.environ['MANIFEST_URL'].strip()
          parsed=urllib.parse.urlparse(raw_url)
          if parsed.scheme != 'https' or not parsed.hostname or parsed.fragment or parsed.username or parsed.password:
              raise SystemExit('manifest_url must be HTTPS without fragment or embedded credentials')
          try:
              host=parsed.hostname.rstrip('.').encode('idna').decode('ascii').lower()
              port=parsed.port or 443
          except (UnicodeError, ValueError):
              raise SystemExit('manifest_url has an invalid hostname or port')
          allowed=set()
          for item in os.environ.get('ALLOWED_HOSTS','').split(','):
              item=item.strip()
              if not item: continue
              p=urllib.parse.urlparse('https://' + item)
              if p.username or p.password or p.path not in ('','/') or p.query or p.fragment:
                  raise SystemExit('invalid MINA_VIDEO_ALLOWED_HOSTS entry')
              try:
                  h=p.hostname.rstrip('.').encode('idna').decode('ascii').lower()
                  allowed.add((h,p.port or 443))
              except (UnicodeError, ValueError):
                  raise SystemExit('invalid MINA_VIDEO_ALLOWED_HOSTS entry')
          if (host,port) not in allowed:
              raise SystemExit('manifest_url host is not approved by MINA_VIDEO_ALLOWED_HOSTS')
          try:
              infos=socket.getaddrinfo(host,port,type=socket.SOCK_STREAM)
          except socket.gaierror as exc:
              raise SystemExit(f'manifest_url DNS resolution failed: {exc}')
          addresses={info[4][0] for info in infos}
          if not addresses:
              raise SystemExit('manifest_url DNS returned no addresses')
          for address in addresses:
              ip=ipaddress.ip_address(address)
              if ip.is_private or ip.is_loopback or ip.is_link_local or ip.is_multicast or ip.is_reserved or ip.is_unspecified:
                  raise SystemExit(f'manifest_url resolves to non-public IP: {address}')
          req=urllib.request.Request(raw_url,headers={'User-Agent':'mina-video-runner/1'})
          with urllib.request.urlopen(req,timeout=30) as r:
              if r.geturl() != raw_url:
                  raise SystemExit('manifest_url redirects are not permitted in manual mode')
              data=r.read(5*1024*1024+1)
          if len(data)>5*1024*1024: raise SystemExit('manifest too large')
          actual=hashlib.sha256(data).hexdigest()
          expected=os.environ['EXPECTED_SHA256'].strip().lower()
          if not expected or actual != expected: raise SystemExit(f'sha256 mismatch: {actual}')
          open('manifest.json','wb').write(data)
          PY

      - name: Require a received manifest
        run: test -s manifest.json

      - name: Validate manifest and derive idempotency tag
        run: |
          python - <<'PY'
          import hashlib,json,re
          m=json.load(open('manifest.json',encoding='utf-8'))
          if m.get('schema')!='external-video/v1': raise SystemExit('unsupported manifest schema')
          job=str(m.get('job_id','')).strip()
          if not re.fullmatch(r'[A-Za-z0-9._-]{1,80}',job): raise SystemExit('job_id is not safe for a release tag')
          raw=open('manifest.json','rb').read()
          digest=hashlib.sha256(raw).hexdigest()
          open('render-tag.env','w').write(f'RENDER_TAG=mina-video-{job}\nMANIFEST_SHA256={digest}\n')
          PY
          test -s manifest.json

      - name: Check existing render before spending render time
        id: duplicate_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./render-tag.env
          if gh release view "$RENDER_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Existing render found; refusing duplicate render."
            gh release view "$RENDER_TAG" --json url --jq .url
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render MP4
        if: steps.duplicate_guard.outputs.exists != 'true'
        run: python video-runner/render.py --manifest manifest.json --output output.mp4 | tee render-result.json

      - name: Build render provenance record
        if: steps.duplicate_guard.outputs.exists != 'true'
        run: |
          . ./render-tag.env
          python - <<'PY'
          import hashlib, json, os
          manifest_sha=os.environ['MANIFEST_SHA256']
          video_sha=hashlib.sha256(open('output.mp4','rb').read()).hexdigest()
          result={}
          try:
              result=json.load(open('render-result.json',encoding='utf-8'))
          except Exception:
              result={"renderer_result":"unparseable"}
          with open('render-release-notes.md','w',encoding='utf-8') as f:
              f.write('# Render provenance\n\n')
              f.write(f'- Manifest SHA-256: `{manifest_sha}`\n')
              f.write(f'- Video SHA-256: `{video_sha}`\n')
              f.write(f'- Render tag: `{os.environ["RENDER_TAG"]}`\n')
              f.write(f'- Result: `{json.dumps(result,ensure_ascii=False,sort_keys=True)}`\n')
          PY

      - name: Publish deterministic render artifact
        if: steps.duplicate_guard.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./render-tag.env
          if gh release view "$RENDER_TAG" >/dev/null 2>&1; then
            echo "Another worker published this job first; no duplicate publication."
            gh release view "$RENDER_TAG" --json url --jq .url
            exit 0
          fi
          gh release create "$RENDER_TAG" output.mp4 --title "Mina Video $RENDER_TAG" --notes-file render-release-notes.md
          gh release view "$RENDER_TAG" --json url --jq .url
