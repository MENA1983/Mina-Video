name: Mina-Video Production Line Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: mina-video-production-line-watchdog
  cancel-in-progress: false

jobs:
  monitor-render-line:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout watchdog classifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read latest render workflow history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/actions/workflows/external-video-render.yml/runs?per_page=20" > render-runs.json

      - name: Classify production line health
        id: health
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python scripts/production_line_watchdog.py \
            --runs-file render-runs.json \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --output-file "$GITHUB_OUTPUT" \
            --report-file production-line-report.json \
            --stale-after-minutes 30

      - name: Open or update a bounded incident
        if: steps.health.outputs.incident == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("production-line-report.json").read_text(encoding="utf-8"))
          title = "MINA-VIDEO PRODUCTION LINE INCIDENT"
          body = [
              "## Production Line Health Incident",
              "",
              f"**State:** {report.get('state', 'UNKNOWN')}",
              f"**Severity:** {report.get('severity', 'ATTENTION')}",
              f"**Reason:** {report.get('reason', 'No reason provided.')}",
              f"**Run ID:** {report.get('run_id', 'unknown')}",
              f"**Run URL:** {report.get('run_url', 'unavailable')}",
              f"**Branch:** {report.get('branch', 'unknown')}",
              f"**Commit:** {report.get('head_sha', 'unknown')}",
              f"**Age (minutes):** {report.get('age_minutes', 'unknown')}",
              "",
              "### Required response",
              "- Preserve the run and its evidence before attempting repair.",
              "- Do not automatically rerun or cancel a render.",
              "- Do not retry an ambiguous Factory dispatch before reconciliation.",
              "- Route remediation to the Mina-Video Branch Manager; escalate repeated or security-related failures to the Factory Company Director and Mena.",
              "- Close this incident only after a successful follow-up run or a documented owner-approved resolution.",
              "",
              "### Scope",
              "This watchdog observes GitHub render workflow status only. It does not prove artifact quality, source rights, or the full Factory-to-publication lifecycle.",
          ]
          Path("production-line-incident.md").write_text("\n".join(body) + "\n", encoding="utf-8")
          Path("production-line-title.txt").write_text(title, encoding="utf-8")
          PY

          TITLE="$(cat production-line-title.txt)"
          EXISTING="$(gh issue list --repo "$REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPOSITORY" --body-file production-line-incident.md
          else
            gh issue create --repo "$REPOSITORY" --title "$TITLE" --body-file production-line-incident.md
          fi
