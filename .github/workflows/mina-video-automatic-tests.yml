name: Mina Video Automatic Tests

on:
  push:
    branches: [main, feat/durable-platform-rate-limits]
  pull_request:
    branches: [main, feat/durable-platform-rate-limits]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mina-video-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest
      - name: Run automatic tests
        run: |
          if [ -d tests ]; then python -m pytest -q; else exit 1; fi
