name: Mina Video Automatic Tests

on:
  push:
    branches: [main, feat/durable-platform-rate-limits]
  pull_request:
    branches: [main, feat/durable-platform-rate-limits]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mina-video-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest
      - name: Run automatic tests
        run: |
          if [ -d tests ]; then python -m pytest -q; else exit 1; fi

  failure-report:
    if: ${{ failure() }}
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Report to Mina-Video monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "AUTO-TEST FAILURE: Mina-Video requires manager attention" --body "Automatic Mina-Video tests failed.
          
Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
Commit: ${{ github.sha }}

Escalation: monitor -> Branch/Factory Manager -> Maintenance/Repair/Development. Do not blindly retry ambiguous external operations. Ordinary media tests stay on Mina-Video public CI."
